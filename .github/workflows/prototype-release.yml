name: Publish prototype APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prototype-release.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify and build public demo APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Verify backend validation
        run: node --test backend/validation.test.js
      - name: Publish durable GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: prototype-v0.1.0
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; leave its submitted asset unchanged."
            exit 0
          fi
          cp app/build/outputs/apk/debug/app-debug.apk CrashAlert-prototype.apk
          gh release create "$TAG" CrashAlert-prototype.apk \
            --target "$GITHUB_SHA" \
            --title "CrashAlert prototype 0.1.0" \
            --notes-file PROTOTYPE-RELEASE.md
